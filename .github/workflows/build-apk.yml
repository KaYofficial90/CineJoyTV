name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build GeckoView APKs
        run: gradle --no-daemon assembleArm64Debug assembleArmv7Debug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: CineJoyTV-GeckoView-ARM64
          path: app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: CineJoyTV-GeckoView-ARMv7
          path: app/build/outputs/apk/armv7/debug/app-armv7-debug.apk
          if-no-files-found: error
