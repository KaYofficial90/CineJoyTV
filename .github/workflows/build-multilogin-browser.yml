name: Build MultiLogin Browser APK
on:
  push:
    branches: [multilogin-browser-apk-build]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        run: base64 --decode multilogin-build/payload.txt | tar -xJf -
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiLoginBrowser-installable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
