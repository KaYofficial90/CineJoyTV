plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kayofficial.cinejoytv'
    compileSdk 36

    defaultConfig {
        applicationId "com.kayofficial.cinejoytv"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions "abi"
    productFlavors {
        arm64 {
            dimension "abi"
        }
        armv7 {
            dimension "abi"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    arm64Implementation "org.mozilla.geckoview:geckoview-arm64-v8a:149.0.20260403140140"
    armv7Implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:149.0.20260403140140"
}
